<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>藍星 AI 週三台中密訓｜工作人員快速簽到</title>
  <meta name="description" content="藍星 AI 週三台中密訓工作人員快速簽到。">
  <link rel="stylesheet" href="./styles.css?v=20260818114400">
</head>
<body>
  <main class="app staff-app">
    <section class="hero staff-hero">
      <h1>週三密訓快速簽到</h1>
      <p>輸入 PIN 後選擇課程與姓名即可快速報到。</p>
      <a class="sheet-link" href="./index.html">回一般簽到頁</a>
    </section>

    <section class="panel staff-toolbar">
      <label>場次
        <select id="staffSession">
          <option value="8/26 AI 龍蝦智能體趨勢班">8/26 AI 龍蝦智能體趨勢班</option>
          <option value="9/2 剪映 &amp; 數字人實戰班">9/2 剪映 &amp; 數字人實戰班</option>
        </select>
      </label>
      <label>PIN
        <input id="staffPin" type="password" inputmode="numeric" maxlength="4" placeholder="第一次請輸入 PIN">
      </label>
      <label>搜尋姓名
        <input id="staffSearch" autocomplete="off" placeholder="輸入姓名關鍵字">
      </label>
      <button id="staffRefresh" type="button">重新整理</button>
    </section>

    <section class="stats staff-stats" id="staffStats"></section>
    <p class="message" id="staffMessage" aria-live="polite"></p>
    <section class="panel staff-list" id="staffList"></section>
  </main>

  <script src="./staff.js?v=20260818114400"></script>
</body>
</html>
